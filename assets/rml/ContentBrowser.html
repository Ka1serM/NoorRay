<template name="ContentBrowser">
    <head>
        <link type="text/rcss" href="ContentBrowser.css" />
    </head>
    <body>
    <div class="content-grid">
        <div class="grid-item">
            <input type="radio" name="content-selection" class="selector" id="select-mat-gold-1" />
            <label class="item-wrapper" for="select-mat-gold-1">
                <div class="preview" style="background: #D4AF37;"></div>
                <span class="name">Gold</span>
            </label>
        </div>
        <div class="grid-item">
            <input type="radio" name="content-selection" class="selector" id="select-mat-diffuse-1" />
            <label class="item-wrapper" for="select-mat-diffuse-1">
                <div class="preview" style="background: #D2B48C;"></div>
                <span class="name">Diffuse</span>
            </label>
        </div>
        <div class="grid-item">
            <input type="radio" name="content-selection" class="selector" id="select-mat-metal-1" checked="true"/>
            <label class="item-wrapper" for="select-mat-metal-1">
                <div class="preview"></div>
                <span class="name">Metal</span>
            </label>
        </div>

        <!-- extra items to force overflow -->
        <div class="grid-item">
            <input type="radio" name="content-selection" class="selector" id="select-mat-gold-2" />
            <label class="item-wrapper" for="select-mat-gold-2">
                <div class="preview" style="background: #FFD700;"></div>
                <span class="name">Gold 2</span>
            </label>
        </div>
        <div class="grid-item">
            <input type="radio" name="content-selection" class="selector" id="select-mat-silver-1" />
            <label class="item-wrapper" for="select-mat-silver-1">
                <div class="preview" style="background: #C0C0C0;"></div>
                <span class="name">Silver</span>
            </label>
        </div>
        <div class="grid-item">
            <input type="radio" name="content-selection" class="selector" id="select-mat-bronze-1" />
            <label class="item-wrapper" for="select-mat-bronze-1">
                <div class="preview" style="background: #CD7F32;"></div>
                <span class="name">Bronze</span>
            </label>
        </div>
        <div class="grid-item">
            <input type="radio" name="content-selection" class="selector" id="select-mat-diamond-1" />
            <label class="item-wrapper" for="select-mat-diamond-1">
                <div class="preview"></div>
                <span class="name">Diamond</span>
            </label>
        </div>
        <div class="grid-item">
            <input type="radio" name="content-selection" class="selector" id="select-mat-emerald-1" />
            <label class="item-wrapper" for="select-mat-emerald-1">
                <div class="preview" style="background: #50C878;"></div>
                <span class="name">Emerald</span>
            </label>
        </div>
        <div class="grid-item">
            <input type="radio" name="content-selection" class="selector" id="select-mat-ruby-1" />
            <label class="item-wrapper" for="select-mat-ruby-1">
                <div class="preview" style="background: #E0115F;"></div>
                <span class="name">Ruby</span>
            </label>
        </div>
        <div class="grid-item">
            <input type="radio" name="content-selection" class="selector" id="select-mat-sapphire-1" />
            <label class="item-wrapper" for="select-mat-sapphire-1">
                <div class="preview" style="background: #0F52BA;"></div>
                <span class="name">Sapphire</span>
            </label>
        </div>
        <div class="grid-item">
            <input type="radio" name="content-selection" class="selector" id="select-mat-quartz-1" />
            <label class="item-wrapper" for="select-mat-quartz-1">
                <div class="preview" style="background: #EEE8AA;"></div>
                <span class="name">Quartz</span>
            </label>
        </div>
        <div class="grid-item">
            <input type="radio" name="content-selection" class="selector" id="select-mat-obsidian-1" />
            <label class="item-wrapper" for="select-mat-obsidian-1">
                <div class="preview" style="background: #2F4F4F;"></div>
                <span class="name">Obsidian</span>
            </label>
        </div>
    </div>
    </body>
</template>
