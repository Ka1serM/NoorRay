<template name="SceneGraph">
    <head>
        <link type="text/rcss" href="SceneGraph.css" />
    </head>
    <body>
        <div data-model="scenegraph_vm">
            <div class="tree">
                <div class="item-container" data-for="node : flat_nodes" data-class-selected="node.id == selected_node_id">
    
                    <div class="item-row"
                         data-attr-style="'padding-left: ' + (node.depth * 20) + 'px'"
                         data-event-click="select_node(node.id)">
                        
                        <span class="expander"
                              data-if="node.has_children"
                              data-class-open="node.is_open"
                              data-event-click="toggle_node(node.id)">
                        </span>
    
                        <span class="expander-spacer" data-if="!node.has_children"></span>
    
                        <span class="name">{{ node.name }}</span>
                    </div>
                </div>
            </div>
        </div>
    </body>
</template>
